[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarena"
version = "1.0.0"
description = "AgentArena: Automated Multi-Turn Conversational Agent Evaluation & Red-Teaming Harness"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "AgentArena Research Group", email = "maintainers@agentarena.dev" }
]
keywords = [
    "agent evaluation",
    "conversational ai",
    "llm red-teaming",
    "virtual agent benchmark",
    "multi-turn dialogue"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.2",
    "litellm>=1.40.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.2.0",
    "isort>=5.13.0",
]

[project.scripts]
agentarena = "agentarena.cli:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "samples*"]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
